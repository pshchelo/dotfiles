username: "{{ ansible_facts['user_id'] }}"
userhome: "{{ ansible_facts['user_dir'] }}"
src_dir: "{{ userhome }}/Projects"
openstack_src_dir: "{{ src_dir }}/openstack"
stack_dir: /opt/stack
stackdev_dir: "{{ userhome }}/stackdev"
stackdev_scripts_target_dir: "{{ userhome }}/.local/bin"
devstack_scripts:
  - src: "{{ stackdev_dir }}/scripts/devlog"
    path: "{{ stackdev_scripts_target_dir }}/devlog"
  - src: "{{ stackdev_dir }}/scripts/devlog"
    path: "{{ stackdev_scripts_target_dir }}/rdevlog"
