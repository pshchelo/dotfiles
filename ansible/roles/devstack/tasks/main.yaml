- name: create directory for DevStack install
  become: yes
  file:
    state: directory
    path: "{{ stack_dir }}"
    owner: "{{ username }}"
    recurse: yes

- name: create directory for openstack source files
  file:
    path: {{ openstack_src_dir }}
    state: directory

- name: get latest DevStack
  git:
    repo: https://opendev.org/openstack/devstack.git
    dest: "{{ openstack_src_dir }}/devstack"

- name: ensure github.com is a known host
  shell: ssh-keyscan github.com >> {{ userhome }}/.ssh/known_hosts

- name: create stub for DevStack's local.conf
  command: cp {{ stackdev_dir }}/conf/local.conf.sample {{ openstack_src_dir }}/devstack/local.conf
  args:
    creates: "{{ openstack_src_dir }}/devstack/local.conf"

- name: make a link to local.sh file for DevStack
  file:
    path: "{{ openstack_src_dir }}/devstack/local.sh"
    src: "{{ stackdev_dir }}/conf/local.sh"
    state: link

- name: ensure target dir for stackdev scripts
  file:
    state: directory
    path: "{{ stackdev_scripts_target_dir }}"

- name: make links to stackdev scripts
  file:
    path: "{{ item.path }}"
    src: "{{ item.src }}"
    state: link
  with_items: "{{ devstack_scripts }}"
